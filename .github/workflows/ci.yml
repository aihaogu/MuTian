name: MuTian checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Swift, library, reader and download checks
        run: ./scripts/test_all.sh
      - name: Build portable application
        env:
          MUTIAN_BUILD_CONFIGURATION: release
        run: ./script/build_and_run.sh --build
      - name: Verify relocated downloader without Python on PATH
        run: ./scripts/test_bundle.sh
